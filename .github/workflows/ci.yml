name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # setup-uv provisions a virtualenv and exports VIRTUAL_ENV; installing
      # with --system instead would hit the runner's externally-managed Python.
      - name: Install
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q

      # The console script must work without the PYTHONPATH workaround the
      # local dev notes describe; CI is the clean environment that proves it.
      - name: CLI smoke test
        run: |
          uv run aedl list
          uv run aedl --help > /dev/null

      - name: Build
        run: |
          uv build
          uvx twine check dist/*
